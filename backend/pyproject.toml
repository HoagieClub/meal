[project]
name = "hoagiemeal"
version = "0.0.3"
description = "Meal by Hoagie"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Hoagie Club", email = "hoagie@princeton.edu" }]
keywords = ["campus dining", "nutrition", "princeton"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Unix",
]
dependencies = [
    "beautifulsoup4>=4.12.3",
    "colorama>=0.4.6",
    "cryptography>=46.0.3",
    "dj-database-url>=2.3.0",
    "django>=5.1",
    "django-cors-headers>=4.6.0",
    "django-heroku>=0.3.1",
    "djangorestframework>=3.15.2",
    "gunicorn>=23.0.0",
    "pyjwt>=2.10.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://meal.hoagie.io/"
Repository = "https://github.com/hoagieclub/meal/"

[tool.uv]
dev-dependencies = ["ruff>=0.7.0"]

[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["hoagiemeal/migrations"]

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, quotes, docstrings, import order.
select = ["E4", "E7", "E9", "F", "B", "Q", "D", "I"]
# No docstrings required on magic methods, nested Meta classes or __init__.
ignore = ["D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
# ModelSerializer subclasses are fully described by their Meta.
"hoagiemeal/serializers.py" = ["D101"]
# Test names are the documentation.
"hoagiemeal/tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hoagiemeal"]
